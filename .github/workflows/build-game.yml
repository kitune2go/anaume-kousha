name: Build and test bundled game

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/build-game.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Simulate episodes and check wall behavior
        run: npm test

      - name: Commit bundled HTML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/anaume.html
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh standalone game"
            git push
          fi
